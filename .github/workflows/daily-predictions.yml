name: Daily predictions

on:
  schedule:
    - cron: "0 5 * * *"        # every day 05:00 UTC
    - cron: "0 9 * * 5,6,0"    # extra run Fri-Sun morning for late odds and team news
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      # Past seasons are committed; the in-progress season's raw downloads are cached
      # between runs so only new matches are fetched.
      - uses: actions/cache@v4
        with:
          path: engine/data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Tests
        working-directory: engine
        run: python -m pytest -q

      - name: Predict upcoming fixtures
        working-directory: engine
        run: python -m src.predict

      - name: Publish predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/predictions.json web/public/data/archive engine/data/live/slip_history.json
          git diff --cached --quiet || git commit -m "Daily predictions $(date -u +%F)"
          git push
