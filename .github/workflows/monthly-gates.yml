name: Monthly gate re-check

# PROJECT.md task 1: the league x bet type gates are re-checked monthly with the same rules and more
# data (backtest legs plus every settled live published prediction). A pair that now passes returns
# to the slips at the next daily run; a pair that now fails leaves them. About 2 minutes a month.
on:
  schedule:
    - cron: "23 1 1 * *"         # 1st of the month, 04:23 Tanzania
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predictions       # never at the same time as a daily run (both push)
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      - name: Re-check the gates
        working-directory: engine
        run: python -m src.market_gates

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/data/processed/market_gates.json engine/reports/market_gates.md
          git diff --cached --quiet && exit 0
          git commit -m "Monthly gate re-check $(date -u +%F)"
          git pull --rebase origin main
          git push
