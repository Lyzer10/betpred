name: Daily predictions

# Daily runs in GitHub's cloud (the PC is not needed). scripts/daily.sh does the
# same job locally as a backup; both pull before pushing, so they never collide.
on:
  schedule:
    - cron: "0 4 * * *"        # 07:00 Tanzania
    - cron: "0 10 * * *"       # 13:00 Tanzania
    - cron: "0 15 * * *"       # 18:00 Tanzania
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:                        # run once whenever this workflow itself changes
    branches: [main]
    paths: [.github/workflows/daily-predictions.yml]

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # first five-league run downloads the new leagues once
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: pip install -r engine/requirements.txt

      # Past seasons are committed; the in-progress season's raw downloads are cached
      # between runs so only new matches are fetched.
      - uses: actions/cache@v4
        with:
          path: engine/data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Tests
        working-directory: engine
        run: python -m pytest -q

      - name: Predict upcoming fixtures
        working-directory: engine
        run: python -m src.predict

      - name: Publish predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/predictions.json web/public/data/archive engine/data/live/slip_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily predictions $(date -u +%F)"
          # The run also rebuilds tracked research files (e.g. matches.parquet) that are not
          # published; drop them so the pull below can rebase onto newer commits.
          git reset --hard HEAD
          git pull --rebase origin main
          git push
